<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#173B32"/>
      <stop offset="100%" stop-color="#0A1C18"/>
    </linearGradient>
    <linearGradient id="pawGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#88CC5B"/>
      <stop offset="100%" stop-color="#64A83C"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F49E58"/>
      <stop offset="100%" stop-color="#E88945"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)"/>
  <rect x="12" y="12" width="488" height="488" rx="108" fill="none" stroke="#73B64B" stroke-width="4" stroke-opacity="0.25"/>

  <!-- Wild Bowl Arc / Rim -->
  <path d="M 128 350 A 140 140 0 0 0 384 350" fill="none" stroke="url(#accentGrad)" stroke-width="20" stroke-linecap="round" opacity="0.9" filter="url(#glow)"/>

  <!-- Paw Print Group -->
  <g filter="url(#glow)">
    <!-- Toes -->
    <ellipse cx="132" cy="180" rx="34" ry="46" transform="rotate(-26, 132, 180)" fill="url(#pawGrad)"/>
    <ellipse cx="208" cy="130" rx="34" ry="48" transform="rotate(-8, 208, 130)" fill="url(#pawGrad)"/>
    <ellipse cx="304" cy="130" rx="34" ry="48" transform="rotate(8, 304, 130)" fill="url(#pawGrad)"/>
    <ellipse cx="380" cy="180" rx="34" ry="46" transform="rotate(26, 380, 180)" fill="url(#pawGrad)"/>

    <!-- Main Pad -->
    <path d="M 256 210 C 205 210 162 250 174 300 C 184 340 220 358 256 358 C 292 358 328 340 338 300 C 350 250 307 210 256 210 Z" fill="url(#pawGrad)"/>
  </g>
</svg>
